<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassino Privado Hub - Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Cinzel:wght@700&display=swap');
        body { font-family: 'Fredoka', sans-serif; }
        .font-oriental { font-family: 'Cinzel', serif; }
        .bg-chinese-red { background: linear-gradient(180deg, #e53935 0%, #b71c1c 50%, #4a0000 100%); }
        .gold-frame {
            border: 4px solid transparent;
            border-image: linear-gradient(to bottom, #fff9c4, #fbc02d, #f57f17, #fff9c4) 1;
            box-shadow: 0 0 20px rgba(251, 192, 45, 0.5), inset 0 0 12px rgba(0,0,0,0.7);
        }
        .slot-window { background: linear-gradient(180deg, #fffdf4 0%, #fbebc6 100%); }
        .blur-spin { animation: subidaDescida 0.08s infinite alternate; filter: blur(4px) brightness(1.1); }
        @keyframes subidaDescida { 0% { transform: translateY(-8px); } 100% { transform: translateY(8px); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-2">

    <div class="w-full max-w-sm bg-zinc-900 rounded-t-[36px] border-t-4 border-x-4 border-stone-800 p-4 flex justify-between items-center text-xs">
        <div>
            <span class="text-[9px] text-stone-400 block uppercase font-bold tracking-wider">Saldo Global</span>
            <span id="saldo-display" class="font-mono font-bold text-emerald-400 text-lg">R$ 0,00</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="UI.mudarJogo('tiger')" class="bg-amber-600 px-3 py-1 rounded-lg text-[10px] font-bold">🐯 Tiger</button>
            <button onclick="UI.mudarJogo('mines')" class="bg-blue-600 px-3 py-1 rounded-lg text-[10px] font-bold">💣 Mines</button>
            <button onclick="UI.toggleAdminModal(true)" class="text-stone-400 hover:text-yellow-500 p-1"><i data-lucide="shield" class="w-4 h-4"></i></button>
        </div>
    </div>

    <div class="w-full max-w-sm bg-zinc-900 rounded-b-[36px] border-b-4 border-x-4 border-stone-800 shadow-2xl overflow-hidden relative min-h-[550px] flex flex-col justify-between">
        
        <div id="game-tiger" class="bg-chinese-red flex-1 flex flex-col justify-between relative">
            <div class="w-full bg-gradient-to-b from-emerald-600 to-emerald-800 pt-3 pb-2 text-center border-b-[3px] border-yellow-500">
                <div class="text-4xl">🐯</div>
                <h2 class="text-xs font-black text-yellow-400 tracking-widest font-oriental">FORTUNE TIGER</h2>
            </div>

            <div class="p-4 flex-1 flex flex-col justify-center">
                <div class="grid grid-cols-3 gap-1 bg-amber-950 p-2 rounded-xl gold-frame relative">
                    <div id="roll-1" class="slot-window rounded-l-lg p-1 flex flex-col justify-around items-center h-40 overflow-hidden">
                        <div id="r1-s1" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r1-s2" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r1-s3" class="w-12 h-12 flex items-center justify-center"></div>
                    </div>
                    <div id="roll-2" class="slot-window p-1 flex flex-col justify-around items-center h-40 overflow-hidden">
                        <div id="r2-s1" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r2-s2" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r2-s3" class="w-12 h-12 flex items-center justify-center"></div>
                    </div>
                    <div id="roll-3" class="slot-window rounded-r-lg p-1 flex flex-col justify-around items-center h-40 overflow-hidden">
                        <div id="r3-s1" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r3-s2" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r3-s3" class="w-12 h-12 flex items-center justify-center"></div>
                    </div>
                </div>
            </div>

            <div class="bg-red-950/90 px-3 py-2 grid grid-cols-2 gap-2 text-center font-mono text-[10px] text-yellow-200 border-t border-yellow-600/20">
                <div class="bg-black/40 rounded py-1 border border-stone-800">
                    <span class="text-stone-400 block text-[8px]">Aposta</span>
                    <span id="txt-aposta-display" class="font-bold text-yellow-400">R$ 10,00</span>
                </div>
                <div class="bg-black/40 rounded py-1 border border-stone-800">
                    <span class="text-stone-400 block text-[8px]">Prêmio Recente</span>
                    <span id="txt-premio-display" class="font-bold text-emerald-400">R$ 0,00</span>
                </div>
            </div>

            <div class="bg-stone-900 p-3 space-y-2">
                <div class="flex items-center justify-center space-x-3">
                    <button onclick="Core.ajustarAposta(-10)" class="w-8 h-8 rounded-full bg-amber-500 text-black font-black text-lg">-</button>
                    <input type="number" id="global-bet-input" value="10" class="w-20 bg-black text-center text-yellow-400 font-mono rounded border border-stone-700 p-1 text-xs">
                    <button onclick="Core.ajustarAposta(10)" class="w-8 h-8 rounded-full bg-amber-500 text-black font-black text-lg">+</button>
                </div>
                <button id="btn-spin" onclick="Core.jogarTiger()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded-xl text-xs uppercase tracking-wider">Girar Roleta</button>
            </div>
        </div>

        <div id="game-mines" class="bg-zinc-950 flex-1 flex flex-col justify-between relative hidden">
            <div class="w-full bg-gradient-to-b from-blue-700 to-blue-900 py-2 text-center border-b-[3px] border-blue-400">
                <h2 class="text-xs font-black text-white tracking-widest">💣 MINES PREMIUM</h2>
            </div>

            <div class="p-4 flex-1 flex items-center justify-center">
                <div id="mines-grid" class="grid grid-cols-5 gap-1.5 p-2 bg-zinc-900 rounded-xl border border-zinc-800 max-w-[280px]">
                    </div>
            </div>

            <div class="bg-zinc-900 p-3 space-y-2 border-t border-zinc-800">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[9px] text-zinc-400 block mb-1">Aposta R$</label>
                        <input type="number" id="mines-bet" value="10" class="w-full bg-black text-white p-1.5 rounded text-xs text-center border border-zinc-700">
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-400 block mb-1">Minas (1-24)</label>
                        <input type="number" id="mines-count" value="3" class="w-full bg-black text-white p-1.5 rounded text-xs text-center border border-zinc-700">
                    </div>
                </div>
                <div class="flex space-x-2">
                    <button id="btn-start-mines" onclick="Core.iniciarMines()" class="flex-1 bg-blue-600 font-bold py-2 rounded-xl text-xs uppercase">Começar Jogo</button>
                    <button id="btn-cashout-mines" onclick="Core.cashoutMines()" disabled class="flex-1 bg-amber-600 opacity-50 font-bold py-2 rounded-xl text-xs uppercase">Cashout</button>
                </div>
            </div>
        </div>

        <div class="p-3 bg-black border-t border-stone-900">
            <div class="flex space-x-2 bg-stone-950 p-1 rounded-xl border border-stone-800">
                <input type="text" id="input-cupom" placeholder="CÓDIGO DE RECARGA VOUCHER" class="w-full bg-transparent text-[10px] px-2 text-center uppercase tracking-widest text-slate-300 focus:outline-none">
                <button onclick="Core.resgatar()" class="bg-amber-500 text-black text-[10px] font-bold px-4 py-1.5 rounded-lg transition hover:bg-amber-400">Resgatar</button>
            </div>
        </div>
    </div>

    <div id="modal-admin" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-stone-900 border-2 border-yellow-600 w-full max-w-xs rounded-2xl p-5 space-y-3">
            <h2 class="font-bold text-center text-yellow-500 font-oriental">Painel Gerenciador</h2>
            <input type="password" id="admin-password" placeholder="Senha Master..." class="w-full bg-black border border-stone-800 rounded-xl px-3 py-2 text-xs text-center text-white focus:outline-none">
            <input type="number" id="admin-amount" value="1000" class="w-full bg-black border border-stone-800 rounded-xl px-3 py-1.5 text-xs text-center text-emerald-400">
            <button onclick="Core.gerarVoucher()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs">Gerar Carga</button>
            <div id="vouchers-list" class="bg-black p-2 rounded-xl max-h-20 overflow-y-auto font-mono text-[9px] text-yellow-400 space-y-1"></div>
            <button onclick="UI.toggleAdminModal(false)" class="w-full text-center text-[10px] text-stone-500">Fechar</button>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-full max-w-xs text-center"></div>

    <script>
       const SVGS = {
            'WILD': `<div class="flex flex-col items-center justify-center animate-bounce text-center"><span class="text-3xl filter drop-shadow">🐯</span><span class="text-[9px] bg-yellow-500 text-red-950 font-black px-1 rounded border border-white uppercase tracking-tighter">WILD</span></div>`,
            'OURO': `<div class="text-center"><span class="text-3xl filter drop-shadow">💰</span><span class="text-[8px] text-amber-600 block font-bold">Lingote</span></div>`,
            'ENVELOPE': `<div class="text-center"><span class="text-3xl filter drop-shadow">🧧</span><span class="text-[8px] text-red-600 block font-bold">Envelope</span></div>`,
            'FOGOS': `<div class="text-center"><span class="text-3xl filter drop-shadow">🧨</span><span class="text-[8px] text-orange-500 block font-bold">Bombinha</span></div>`,
            'LARANJA': `<div class="text-center"><span class="text-3xl filter drop-shadow">🍊</span><span class="text-[8px] text-amber-500 block font-bold">Sorte</span></div>`
        };
        let girando = false;
        let minesEmAndamento = false;

        const UI = {
            mudarJogo: (jogo) => {
                document.getElementById('game-tiger').classList.toggle('hidden', jogo !== 'tiger');
                document.getElementById('game-mines').classList.toggle('hidden', jogo !== 'mines');
                if(jogo === 'mines') UI.buildMinesGrid();
            },
            atualizarSaldo: async () => {
                const res = await fetch('/api/saldo');
                const data = await res.json();
                document.getElementById('saldo-display').innerText = data.saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            },
            toggleAdminModal: (show) => { document.getElementById('modal-admin').classList.toggle('hidden', !show); },
            notify: (msg, s = true) => {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = `p-3 rounded-xl shadow-2xl text-xs font-bold border my-2 ${s ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}`;
                t.innerText = msg; c.appendChild(t); setTimeout(() => t.remove(), 2000);
            },
            setGradeInicial: () => {
                const mock = ['OURO', 'WILD', 'FOGOS', 'ENVELOPE', 'ENVELOPE', 'LARANJA', 'LARANJA', 'WILD', 'OURO'];
                let idx = 0;
                for(let r=1; r<=3; r++){
                    for(let s=1; s<=3; s++) document.getElementById(`r${r}-s${s}`).innerHTML = SVGS[mock[idx++]] || '💎';
                }
            },
            buildMinesGrid: () => {
                const g = document.getElementById('mines-grid');
                g.innerHTML = '';
                for(let i=0; i<25; i++) {
                    g.innerHTML += `<button onclick="Core.clicarMines(${i})" id="mine-${i}" disabled class="w-11 h-11 bg-zinc-800 rounded-lg border border-zinc-700 flex items-center justify-center font-bold text-lg hover:bg-zinc-700 transition-all">❓</button>`;
                }
            }
        };

        const Core = {
            ajustarAposta: (qtd) => {
                const inp = document.getElementById('global-bet-input');
                let val = (parseFloat(inp.value) || 10) + qtd;
                if(val < 1) val = 1;
                inp.value = val;
                document.getElementById('txt-aposta-display').innerText = val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            },
            jogarTiger: async () => {
                if(girando) return;
                const aposta = parseFloat(document.getElementById('global-bet-input').value);

                girando = true;
                document.getElementById('roll-1').classList.add('blur-spin');
                document.getElementById('roll-2').classList.add('blur-spin');
                document.getElementById('roll-3').classList.add('blur-spin');

                try {
                    const resposta = await fetch('/api/jogar-tiger', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ aposta })
                    });
                    
                    const data = await resposta.json();
                    
                    if(!resposta.ok) {
                        UI.notify(data.erro, false);
                        throw new Error(data.erro);
                    }

                    setTimeout(() => {
                        document.getElementById('roll-1').classList.remove('blur-spin');
                        document.getElementById('roll-2').classList.remove('blur-spin');
                        document.getElementById('roll-3').classList.remove('blur-spin');

                        for(let r=1; r<=3; r++) {
                            for(let s=1; s<=3; s++) document.getElementById(`r${r}-s${s}`).innerHTML = SVGS[data.matriz[r-1][s-1]];
                        }

                        if(data.ganhou) {
                            document.getElementById('txt-premio-display').innerText = "R$ " + data.premio.toFixed(2);
                            UI.notify(`VITÓRIA! +R$ ${data.premio.toFixed(2)}`);
                        } else {
                            document.getElementById('txt-premio-display').innerText = "R$ 0,00";
                        }
                        UI.atualizarSaldo();
                        girando = false;
                    }, 1000);

                } catch (e) {
                    document.getElementById('roll-1').classList.remove('blur-spin');
                    document.getElementById('roll-2').classList.remove('blur-spin');
                    document.getElementById('roll-3').classList.remove('blur-spin');
                    girando = false;
                }
            },
            iniciarMines: async () => {
                const aposta = parseFloat(document.getElementById('mines-bet').value);
                const minas = parseInt(document.getElementById('mines-count').value);

                const res = await fetch('/api/mines/iniciar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aposta, minas })
                });
                const data = await res.json();

                if(!res.ok) return UI.notify(data.erro, false);

                minesEmAndamento = true;
                UI.atualizarSaldo();
                UI.buildMinesGrid();
                
                // Ativar os botões do tabuleiro
                for(let i=0; i<25; i++) document.getElementById(`mine-${i}`).disabled = false;
                document.getElementById('btn-cashout-mines').disabled = false;
                document.getElementById('btn-cashout-mines').classList.remove('opacity-50');
                UI.notify("Mines Iniciado! Escolha as cartas.");
            },
            clicarMines: async (index) => {
                if(!minesEmAndamento) return;

                const res = await fetch('/api/mines/revelar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index })
                });
                const data = await res.json();

                const btn = document.getElementById(`mine-${index}`);
                if(data.perdeu) {
                    btn.innerText = '💥';
                    btn.classList.add('bg-red-600');
                    UI.notify("BOMBA! Você perdeu tudo.", false);
                    minesEmAndamento = false;
                    document.getElementById('btn-cashout-mines').disabled = true;
                    document.getElementById('btn-cashout-mines').classList.add('opacity-50');
                    UI.atualizarSaldo();
                } else {
                    btn.innerText = '💎';
                    btn.classList.add('bg-emerald-600');
                    btn.disabled = true;
                    document.getElementById('btn-cashout-mines').innerText = `Cashout (R$ ${data.proximoPremio.toFixed(2)})`;
                }
            },
            cashoutMines: async () => {
                const res = await fetch('/api/mines/cashout', { method: 'POST' });
                const data = await res.json();

                if(!res.ok) return UI.notify(data.erro, false);

                UI.notify(`Lucro salvo! +R$ ${data.ganho.toFixed(2)}`);
                minesEmAndamento = false;
                document.getElementById('btn-cashout-mines').disabled = true;
                document.getElementById('btn-cashout-mines').classList.add('opacity-50');
                document.getElementById('btn-cashout-mines').innerText = "Cashout";
                UI.atualizarSaldo();
                UI.buildMinesGrid();
            },
            resgatar: async () => {
                const token = document.getElementById('input-cupom').value;
                const res = await fetch('/api/resgatar-voucher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if(res.ok) { 
                    UI.notify("Saldo Carregado!"); 
                    document.getElementById('input-cupom').value = ''; 
                    await UI.atualizarSaldo(); 
                } else { 
                    UI.notify(data.erro, false); 
                }
            },
            gerarVoucher: async () => {
                const senha = document.getElementById('admin-password').value;
                const valor = document.getElementById('admin-amount').value;
                const res = await fetch('/api/admin/gerar-voucher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha, valor })
                });
                const data = await res.json();
                if(res.ok) {
                    const list = document.getElementById('vouchers-list');
                    list.innerHTML = Object.keys(data.lista).map(k => `<div>${k} -> R$ ${data.lista[k]}</div>`).join('');
                    UI.notify("Token Criado!");
                } else { UI.notify(data.erro, false); }
            }
        };

        window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); UI.setGradeInicial(); UI.atualizarSaldo(); });
    </script>
</body>
</html>
