<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune Tiger - Cloud Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Cinzel:wght@700&display=swap');
        body { font-family: 'Fredoka', sans-serif; }
        .font-oriental { font-family: 'Cinzel', serif; }
        .bg-chinese-red { background: linear-gradient(180deg, #e53935 0%, #b71c1c 50%, #4a0000 100%); }
        .gold-frame {
            border: 4px solid transparent;
            border-image: linear-gradient(to bottom, #fff9c4, #fbc02d, #f57f17, #fff9c4) 1;
            box-shadow: 0 0 20px rgba(251, 192, 45, 0.5), inset 0 0 12px rgba(0,0,0,0.7);
        }
        .slot-window { background: linear-gradient(180deg, #fffdf4 0%, #fbebc6 100%); }
        .blur-spin { animation: subidaDescida 0.08s infinite alternate; filter: blur(4px) brightness(1.1); }
        @keyframes subidaDescida { 0% { transform: translateY(-8px); } 100% { transform: translateY(8px); } }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen flex flex-col items-center justify-center p-2">

    <div class="w-full max-w-sm bg-zinc-900 rounded-[36px] border-4 border-stone-800 shadow-2xl overflow-hidden relative min-h-[630px] flex flex-col justify-between">
        
        <div class="bg-black/80 px-4 py-2 flex justify-between items-center border-b border-stone-800 text-xs">
            <div>
                <span class="text-[9px] text-stone-400 block uppercase font-bold tracking-wider">Saldo Nuvem</span>
                <span id="saldo-display" class="font-mono font-bold text-emerald-400 text-sm">R$ 0,00</span>
            </div>
            <button onclick="UI.toggleAdminModal(true)" class="text-stone-600 hover:text-yellow-500 transition p-1"><i data-lucide="shield" class="w-4 h-4"></i></button>
        </div>

        <div class="bg-chinese-red flex-1 flex flex-col justify-between relative">
            <div class="w-full bg-gradient-to-b from-emerald-600 to-emerald-800 pt-4 pb-3 text-center relative border-b-[3px] border-yellow-500">
                <div class="text-5xl id="tiger-character">🐯</div>
                <h2 class="text-sm font-black text-yellow-400 tracking-widest font-oriental mt-1">FORTUNE TIGER</h2>
            </div>

            <div class="p-3 flex-1 flex flex-col justify-center">
                <div class="grid grid-cols-3 gap-1 bg-amber-950 p-2 rounded-xl gold-frame relative">
                    <div id="roll-1" class="slot-window rounded-l-lg p-1 flex flex-col justify-around items-center h-48 overflow-hidden">
                        <div id="r1-s1" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r1-s2" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r1-s3" class="w-12 h-12 flex items-center justify-center"></div>
                    </div>
                    <div id="roll-2" class="slot-window p-1 flex flex-col justify-around items-center h-48 overflow-hidden">
                        <div id="r2-s1" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r2-s2" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r2-s3" class="w-12 h-12 flex items-center justify-center"></div>
                    </div>
                    <div id="roll-3" class="slot-window rounded-r-lg p-1 flex flex-col justify-around items-center h-48 overflow-hidden">
                        <div id="r3-s1" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r3-s2" class="w-12 h-12 flex items-center justify-center"></div>
                        <div id="r3-s3" class="w-12 h-12 flex items-center justify-center"></div>
                    </div>
                </div>
            </div>

            <div class="bg-red-950/90 border-t border-yellow-600/30 px-3 py-1.5 grid grid-cols-3 gap-1 text-center font-mono text-[10px] text-yellow-200">
                <div class="bg-black/40 rounded py-0.5 border border-stone-800">
                    <span class="text-stone-400 block text-[8px]">Ganhos</span>
                    <span id="txt-ganho-display" class="font-bold text-white">R$ 0,00</span>
                </div>
                <div class="bg-black/40 rounded py-0.5 border border-stone-800">
                    <span class="text-stone-400 block text-[8px]">Aposta</span>
                    <span id="txt-aposta-display" class="font-bold text-yellow-400">R$ 10,00</span>
                </div>
                <div class="bg-black/40 rounded py-0.5 border border-stone-800">
                    <span class="text-stone-400 block text-[8px]">Prêmio Total</span>
                    <span id="txt-premio-display" class="font-bold text-emerald-400">R$ 0,00</span>
                </div>
            </div>
        </div>

        <div class="bg-gradient-to-b from-stone-900 to-black p-4 space-y-3 border-t border-stone-800">
            <div class="flex items-center justify-center space-x-4">
                <button onclick="Core.ajustarAposta(-10)" class="w-8 h-8 rounded-full bg-gradient-to-b from-yellow-400 to-amber-600 text-stone-950 font-black text-xl">-</button>
                <div class="text-center bg-stone-950 border border-stone-800 rounded-xl px-4 py-1 min-w-[130px]">
                    <span class="text-[8px] text-stone-400 block font-bold">Aposta Máx 10k</span>
                    <div class="flex items-center justify-center text-yellow-400 font-mono font-bold text-xs">
                        R$&nbsp;<input type="number" id="global-bet-input" value="10" min="1" max="10000" onchange="Core.validarAposta()" class="w-16 bg-transparent text-center focus:outline-none font-black">
                    </div>
                </div>
                <button onclick="Core.ajustarAposta(10)" class="w-8 h-8 rounded-full bg-gradient-to-b from-yellow-400 to-amber-600 text-stone-950 font-black text-xl">+</button>
            </div>
            <div class="flex justify-center">
                <button id="btn-spin" onclick="Core.jogar()" class="w-14 h-14 rounded-full bg-gradient-to-b from-emerald-400 to-teal-700 border-4 border-yellow-400 flex items-center justify-center"><i data-lucide="play" class="w-5 h-5 text-white fill-white ml-0.5"></i></button>
            </div>
        </div>

        <div class="p-2 bg-black border-t border-stone-900">
            <div class="flex space-x-2 bg-stone-950 p-1 rounded-xl border border-stone-800">
                <input type="text" id="input-cupom" placeholder="CÓDIGO DE RECARGA" class="w-full bg-transparent text-[9px] px-2 text-center uppercase tracking-widest text-slate-400 focus:outline-none">
                <button onclick="Core.resgatar()" class="bg-stone-800 text-yellow-500 text-[9px] font-bold px-3 py-1 rounded-lg">Inserir</button>
            </div>
        </div>
    </div>

    <div id="modal-admin" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-stone-900 border-2 border-yellow-600 w-full max-w-xs rounded-2xl p-5 space-y-3">
            <h2 class="font-bold text-center text-yellow-500 font-oriental">Painel Gerenciador</h2>
            <input type="password" id="admin-password" placeholder="Senha Master..." class="w-full bg-black border border-stone-800 rounded-xl px-3 py-2 text-xs text-center text-white focus:outline-none">
            <input type="number" id="admin-amount" value="1000" class="w-full bg-black border border-stone-800 rounded-xl px-3 py-1.5 text-xs text-center text-emerald-400">
            <button onclick="Core.gerarVoucher()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-xl text-xs">Gerar Carga</button>
            <div id="vouchers-list" class="bg-black p-2 rounded-xl max-h-20 overflow-y-auto font-mono text-[9px] text-yellow-400 space-y-1"></div>
            <button onclick="UI.toggleAdminModal(false)" class="w-full text-center text-[10px] text-stone-500">Fechar</button>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-full max-w-xs text-center"></div>

    <script>
        const SVGS = {
            'WILD': `<svg viewBox="0 0 64 64" class="w-12 h-12"><circle cx="32" cy="32" r="28" fill="url(#gT)" stroke="#f57f17" stroke-width="2"/><text x="32" y="32" font-weight="900" font-size="14" fill="#fff" text-anchor="middle" dominant-baseline="middle">WILD</text><text x="32" y="48" font-size="12" text-anchor="middle" dominant-baseline="middle">🐯</text><defs><linearGradient id="gT"><stop offset="0%" stop-color="#ff9800"/><stop offset="100%" stop-color="#e65100"/></linearGradient></defs></svg>`,
            'OURO': `<svg viewBox="0 0 64 64" class="w-12 h-12"><path d="M12 40 Q 32 50 52 40 L 56 24 Q 32 32 8 24 Z" fill="url(#gO)" stroke="#ffb300" stroke-width="2"/><ellipse cx="32" cy="24" rx="16" ry="6" fill="#fff59d"/><defs><linearGradient id="gO" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ffd54f"/><stop offset="100%" stop-color="#ff8f00"/></linearGradient></defs></svg>`,
            'ENVELOPE': `<svg viewBox="0 0 64 64" class="w-10 h-10"><rect x="12" y="14" width="40" height="36" rx="4" fill="#e53935" stroke="#b71c1c" stroke-width="2"/><polygon points="12,14 32,32 52,14" fill="#c62828"/><circle cx="32" cy="34" r="6" fill="#fbc02d"/></svg>`,
            'FOGOS': `<svg viewBox="0 0 64 64" class="w-10 h-10"><path d="M24 16 L40 16 L36 48 L28 48 Z" fill="#1e88e5"/><rect x="26" y="10" width="12" height="6" fill="#e53935"/><line x1="32" y1="48" x2="32" y2="58" stroke="#ffb300" stroke-width="3"/></svg>`,
            'LARANJA': `<svg viewBox="0 0 64 64" class="w-10 h-10"><circle cx="32" cy="36" r="18" fill="#ff9800"/><path d="M32 18 Q 36 12 30 10 Q 26 12 32 18" fill="#4caf50"/></svg>`
        };
        const chavesItens = ['WILD', 'OURO', 'ENVELOPE', 'FOGOS', 'LARANJA'];
        let girando = false;

        const UI = {
            atualizarSaldo: async () => {
                const res = await fetch('/api/saldo');
                const data = await res.json();
                document.getElementById('saldo-display').innerText = data.saldo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            },
            toggleAdminModal: (show) => { document.getElementById('modal-admin').classList.toggle('hidden', !show); },
            notify: (msg, s = true) => {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = `p-3 rounded-xl shadow-2xl text-xs font-bold border my-2 ${s ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'}`;
                t.innerText = msg; c.appendChild(t); setTimeout(() => t.remove(), 2000);
            },
            setGradeInicial: () => {
                const mock = ['OURO', 'WILD', 'FOGOS', 'ENVELOPE', 'ENVELOPE', 'LARANJA', 'LARANJA', 'WILD', 'OURO'];
                let idx = 0;
                for(let r=1; r<=3; r++){
                    for(let s=1; s<=3; s++) document.getElementById(`r${r}-s${s}`).innerHTML = SVGS[mock[idx++]];
                }
            }
        };

        const Core = {
            validarAposta: () => {
                const inp = document.getElementById('global-bet-input');
                let val = parseFloat(inp.value) || 10;
                if(val < 1) val = 1; if(val > 10000) val = 10000;
                inp.value = val;
                document.getElementById('txt-aposta-display').innerText = val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            },
            ajustarAposta: (qtd) => {
                if(girando) return;
                const inp = document.getElementById('global-bet-input');
                inp.value = (parseFloat(inp.value) || 10) + qtd;
                Core.validarAposta();
            },
            jogar: async () => {
                Core.validarAposta();
                const aposta = parseFloat(document.getElementById('global-bet-input').value);
                if(girando) return;

                document.getElementById('roll-1').classList.add('blur-spin');
                document.getElementById('roll-2').classList.add('blur-spin');
                document.getElementById('roll-3').classList.add('blur-spin');
                girando = true;

                // Faz a requisição segura para o Back-end
                const resposta = await fetch('/api/jogar-tiger', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ aposta })
                });
                
                const data = await resposta.json();
                if(!resposta.ok) {
                    UI.notify(data.erro, false);
                    document.getElementById('roll-1').classList.remove('blur-spin');
                    document.getElementById('roll-2').classList.remove('blur-spin');
                    document.getElementById('roll-3').classList.remove('blur-spin');
                    girando = false;
                    return;
                }

                let ciclos = 0;
                const randomKey = () => chavesItens[Math.floor(Math.random() * chavesItens.length)];
                
                const animacao = setInterval(() => {
                    for(let r=1; r<=3; r++) {
                        for(let s=1; s<=3; s++) document.getElementById(`r${r}-s${s}`).innerHTML = SVGS[randomKey()];
                    }
                    if(ciclos++ > 10) {
                        clearInterval(animacao);
                        document.getElementById('roll-1').classList.remove('blur-spin');
                        document.getElementById('roll-2').classList.remove('blur-spin');
                        document.getElementById('roll-3').classList.remove('blur-spin');

                        // Aplica o resultado real vindo da nuvem
                        for(let r=1; r<=3; r++) {
                            for(let s=1; s<=3; s++) document.getElementById(`r${r}-s${s}`).innerHTML = SVGS[data.matriz[r-1][s-1]];
                        }

                        if(data.ganhou) {
                            document.getElementById('txt-ganho-display').innerText = "R$ " + data.premio.toFixed(2);
                            document.getElementById('txt-premio-display').innerText = "R$ " + data.premio.toFixed(2);
                            UI.notify(`VITÓRIA! +R$ ${data.premio.toFixed(2)}`);
                        }
                        UI.atualizarSaldo();
                        girando = false;
                    }
                }, 80);
            },
            resgatar: async () => {
                const token = document.getElementById('input-cupom').value;
                const res = await fetch('/api/resgatar-voucher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                if(res.ok) { UI.notify("Saldo Carregado!"); UI.atualizarSaldo(); document.getElementById('input-cupom').value = ''; }
                else { UI.notify(data.erro, false); }
            },
            gerarVoucher: async () => {
                const senha = document.getElementById('admin-password').value;
                const valor = document.getElementById('admin-amount').value;
                const res = await fetch('/api/admin/gerar-voucher', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ senha, valor })
                });
                const data = await res.json();
                if(res.ok) {
                    const list = document.getElementById('vouchers-list');
                    list.innerHTML = Object.keys(data.lista).map(k => `<div>${k} -> R$ ${data.lista[k]}</div>`).join('');
                    UI.notify("Token Criado!");
                } else { UI.notify(data.erro, false); }
            }
        };

        window.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); UI.setGradeInicial(); UI.atualizarSaldo(); });
    </script>
</body>
</html>
